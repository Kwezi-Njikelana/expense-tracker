<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #94a3e8 0%, #8151b1 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        
        .header { 
            text-align: center; 
            margin-bottom: 30px;
            color: #333;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .form-container { 
            background: white; 
            padding: 25px; 
            border-radius: 10px; 
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .form-container h2 {
            color: #333;
            margin-bottom: 20px;
        }
        
        .form-row { 
            display: flex; 
            gap: 15px; 
            margin-bottom: 15px; 
            flex-wrap: wrap; 
        }
        
        .form-group { 
            flex: 1; 
            min-width: 200px; 
        }
        
        label { 
            display: block; 
            margin-bottom: 5px; 
            font-weight: 600;
            color: #555;
        }
        
        input, select { 
            width: 100%; 
            padding: 12px; 
            border: 2px solid #e1e5e9; 
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button { 
            padding: 12px 25px; 
            background: linear-gradient(45deg, #94a3e8, #8151b1);
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        
        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .summary { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
            gap: 20px; 
            margin-bottom: 30px; 
        }
        
        .summary-card { 
            background: white; 
            padding: 25px; 
            border-radius: 10px; 
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-left: 4px solid #c810a9;
        }
        
        .summary-card h3 { 
            color: #666; 
            margin-bottom: 10px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .summary-card .amount { 
            font-size: 2.2em; 
            color: #c810a9; 
            font-weight: bold; 
        }
        
        .expenses-list { 
            background: white; 
            border-radius: 10px; 
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .expense-item { 
            padding: 20px; 
            border-bottom: 1px solid #eee; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            transition: background-color 0.2s;
        }
        
        .expense-item:hover {
            background-color: #f8f9fa;
        }
        
        .expense-item:last-child {
            border-bottom: none;
        }
        
        .expense-info { 
            flex: 1; 
        }
        
        .expense-info strong {
            color: #333;
            font-size: 16px;
            display: block;
            margin-bottom: 5px;
        }
        
        .expense-info small {
            color: #666;
            font-size: 14px;
        }
        
        .expense-amount { 
            font-weight: bold; 
            color: #182886;
            font-size: 18px;
            margin-right: 15px;
        }
        
        .delete-btn { 
            background: #ea257a; 
            color: white; 
            border: none; 
            padding: 8px 15px; 
            border-radius: 5px; 
            cursor: pointer;
            font-size: 12px;
            transition: background-color 0.2s;
        }
        
        .delete-btn:hover {
            background: #c0392b;
            transform: none;
            box-shadow: none;
        }
        
        .filters { 
            background: white; 
            padding: 20px; 
            border-radius: 10px; 
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
       
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
            font-style: italic;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
            border: 1px solid #f5c6cb;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .empty-state h3 {
            margin-bottom: 10px;
            color: #999;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 20px;
                margin: 10px;
            }
            
            .form-row {
                flex-direction: column;
            }
            
            .summary {
                grid-template-columns: 1fr;
            }
            
            .expense-item {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }
            
            .expense-amount {
                margin-right: 0;
                align-self: flex-end;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💰 Expense Tracker</h1>
            <p>Keep track of your spending</p>
        </div>

        <div class="form-container">
            <h2>Add New Expense</h2>
            <form id="expenseForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="description">Description</label>
                        <input type="text" id="description" placeholder="What did you spend on?" required>
                    </div>
                    <div class="form-group">
                        <label for="amount">Amount (R)</label>
                        <input type="number" id="amount" step="0.01" placeholder="0.00" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="">Select Category</option>
                            <option value="Food">🍔 Food</option>
                            <option value="Transportation">🚗 Transportation</option>
                            <option value="Entertainment">🎬 Entertainment</option>
                            <option value="Utilities">⚡ Utilities</option>
                            <option value="Healthcare">🏥 Healthcare</option>
                            <option value="Shopping">🛍️ Shopping</option>
                            <option value="Other">📦 Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="date">Date</label>
                        <input type="date" id="date" required>
                    </div>
                </div>
                <button type="submit">Add Expense</button>
            </form>
        </div>

        <div class="summary" id="summary">
            <div class="loading">Loading summary...</div>
        </div>


        <div class="filters">
            <label for="categoryFilter">Filter by Category:</label>
            <select id="categoryFilter">
                <option value="all">All Categories</option>
                <option value="Food">🍔 Food</option>
                <option value="Transportation">🚗 Transportation</option>
                <option value="Entertainment">🎬 Entertainment</option>
                <option value="Utilities">⚡ Utilities</option>
                <option value="Healthcare">🏥 Healthcare</option>
                <option value="Shopping">🛍️ Shopping</option>
                <option value="Other">📦 Other</option>
            </select>
        </div>

        <div class="expenses-list" id="expensesList">
            <div class="loading">Loading expenses...</div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';

        document.getElementById('date').value = new Date().toISOString().split('T')[0];

        document.addEventListener('DOMContentLoaded', function() {
            loadExpenses();
            updateSummary();
        });

        document.getElementById('expenseForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const expense = {
                description: document.getElementById('description').value,
                amount: parseFloat(document.getElementById('amount').value),
                category: document.getElementById('category').value,
                date: document.getElementById('date').value
            };

            try {
                const response = await fetch(`${API_BASE}/expenses`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(expense)
                });

                if (response.ok) {
                    document.getElementById('description').value = '';
                    document.getElementById('amount').value = '';
                    document.getElementById('category').value = '';
                    document.getElementById('date').value = new Date().toISOString().split('T')[0];
                    
                    // Refresh data
                    loadExpenses();
                    updateSummary();
                } else {
                    const error = await response.json();
                    alert('Error: ' + error.error);
                }
            } catch (error) {
                console.error('Error adding expense:', error);
                alert('Error adding expense: ' + error.message);
            }
        });

        // Category filter
        document.getElementById('categoryFilter').addEventListener('change', loadExpenses);

        async function loadExpenses() {
            const categoryFilter = document.getElementById('categoryFilter').value;
            const container = document.getElementById('expensesList');
            
            try {
                const url = categoryFilter === 'all' ? 
                    `${API_BASE}/expenses` : 
                    `${API_BASE}/expenses?category=${categoryFilter}`;
                
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error('Failed to fetch expenses');
                }
                
                const expenses = await response.json();
                
                if (expenses.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <h3>No expenses found</h3>
                            <p>Start by adding your first expense above!</p>
                        </div>
                    `;
                    return;
                }

                // Sort expenses by date (newest first)
                expenses.sort((a, b) => new Date(b.date) - new Date(a.date));

                container.innerHTML = expenses.map(expense => `
                    <div class="expense-item">
                        <div class="expense-info">
                            <strong>${expense.description}</strong>
                            <small>${expense.category} • ${new Date(expense.date).toLocaleDateString()}</small>
                        </div>
                        <div class="expense-amount">R${expense.amount.toFixed(2)}</div>
                        <button class="delete-btn" onclick="deleteExpense(${expense.id})">Delete</button>
                    </div>
                `).join('');
                
            } catch (error) {
                console.error('Error loading expenses:', error);
                container.innerHTML = '<div class="error">Error loading expenses</div>';
            }
        }

        async function deleteExpense(id) {
            if (!confirm('Are you sure you want to delete this expense?')) return;
            
            try {
                const response = await fetch(`${API_BASE}/expenses/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    loadExpenses();
                    updateSummary();
                } else {
                    alert('Error deleting expense');
                }
            } catch (error) {
                console.error('Error deleting expense:', error);
                alert('Error deleting expense: ' + error.message);
            }
        }

        async function updateSummary() {
            const container = document.getElementById('summary');
            
            try {
                const response = await fetch(`${API_BASE}/expenses/summary`);
                
                if (!response.ok) {
                    throw new Error('Failed to fetch summary');
                }
                
                const summary = await response.json();

                container.innerHTML = `
                    <div class="summary-card">
                        <h3>Total Expenses</h3>
                        <div class="amount">R${summary.total.toFixed(2)}</div>
                    </div>
                    <div class="summary-card">
                        <h3>This Month</h3>
                        <div class="amount">R${summary.monthlyTotal.toFixed(2)}</div>
                    </div>
                    <div class="summary-card">
                        <h3>Total Transactions</h3>
                        <div class="amount">${summary.count}</div>
                    </div>
                    <div class="summary-card">
                        <h3>Average per Transaction</h3>
                        <div class="amount">R${summary.count > 0 ? (summary.total / summary.count).toFixed(2) : '0.00'}</div>
                    </div>
                `;
            } catch (error) {
                console.error('Error loading summary:', error);
                container.innerHTML = '<div class="error">Error loading summary</div>';
            }
        }
    </script>
</body>
</html>
